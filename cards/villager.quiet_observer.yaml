id: villager.quiet_observer
version: 2
role: Villager
source: "Team Liquid, 'A general guide to Mafia' (read the thread before posting); general Mafia advice"
summary: Watch first, speak when you have something.
instructions: >
  Watch before you speak. Bid 0 or 1 early and notice who talks, who stays quiet
  and how people vote. Once you see something in the log, such as a changed
  vote, bid 2 and quote the line. Vote on the evidence you have, not with the
  crowd.
expected_moves: [record_check, hedge, accuse_reasoned]
