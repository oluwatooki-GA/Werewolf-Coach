name: ci

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the floor guard compares against origin/main

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv sync --locked

      # Fails on weakened tests, new suppressions, unapproved dependencies and edits to the bar.
      - run: uv run --no-project python scripts/floor_guard.py --base origin/main

      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
