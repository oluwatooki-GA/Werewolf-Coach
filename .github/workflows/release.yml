name: release

# Pushing a tag such as v0.1.0 marks a release: the checks run again, the database is prepared, the
# live API is checked to be healthy with no fault switch on, and a GitHub release records it.
# Render and Vercel deploy by themselves when the repository is pushed, so nothing here calls them.
# The one secret, DATABASE_URL, comes from the repository's Actions secrets; none is written here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run python -m werewolf.cli evals

  deploy:
    needs: [checks, evals]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # to write the release that marks the deploy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv sync --locked

      - name: Prepare the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m werewolf.cli app migrate

      # the API's address is a repository variable (not a secret): the Render address. A sleeping
      # free service takes a minute to wake, so this tries for a while.
      - name: Check the live API, and that no fault switch is on
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl --silent --max-time 20 "$API_URL/health" || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              echo "$body" | grep -q '"faults":\[\]' || { echo "A fault switch is on in production."; exit 1; }
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 20
          done
          echo "The API did not become healthy in 20 minutes."
          exit 1

      - name: Mark the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
