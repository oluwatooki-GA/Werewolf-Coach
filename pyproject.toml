[project]
name = "werewolf"
version = "0.1.0"
description = "Werewolf Coach: AI agents play Werewolf with swappable strategy cards"
authors = [
    { name = "oluwatooki-GA", email = "oluwatooki.g.adegbite@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
