[project]
name = "werewolf"
version = "0.1.0"
description = "Werewolf Coach: AI agents play Werewolf with swappable strategy cards"
authors = [
    { name = "oluwatooki-GA", email = "oluwatooki.g.adegbite@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "langgraph>=1.2.16",
    "litellm>=1.105.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 6"  # games are played in many tests: run them side by side

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
