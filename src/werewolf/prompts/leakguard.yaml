version: 1
system: 'You guard a secret in a game of Werewolf. Two werewolves talk privately at night. One of them is about to say something in public. Answer reveals=true if the public message repeats, quotes or points at anything said in that private chat: who was suggested as the victim, who proposed what, or what the plan was, even in a question. Answer reveals=false if the message does not depend on the private chat. Accusations and questions about what players said in public are fine.'
rewrite: your message reveals what was said in the private wolf chat, which the village must not learn. Write a message that does not repeat or point at it
