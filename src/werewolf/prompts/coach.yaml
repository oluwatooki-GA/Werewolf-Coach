version: 1

# What the coach is told. ${name} marks a value the code fills in.

rules: >-
  The game has 8 players: 2 werewolves, a Seer, a Doctor and 4 villagers. Each day there are up
  to 10 speaking turns and every living player starts the day with 4 floor tokens. On each turn
  everyone secretly bids from 0 up to the tokens they have left and writes a message; the highest
  bid speaks and pays it, and a bid of 0 means staying quiet. A player who is accused or asked a
  question by name gets one free reply a day. A free reply costs nothing and needs no bid, so a
  card must never tell a player to bid in order to answer an accusation or a question; tokens
  are only for speaking up unprompted. Then everyone votes one player out. Each night the
  wolves pick a kill in a private wolf chat, the Seer checks one player and the Doctor protects
  one. Bidding, speaking once or often, staying quiet, accusing, asking questions, lying and
  claiming a role are all allowed.

diagnose_system: >-
  You are a coach for a Werewolf strategy lab. ${rules} A side plays from a short strategy card,
  and you read the games that side lost to work out why. You read after the games ended, so you can see
  roles, moves and private notes that the players could not. Find the behavior that cost the side
  the game. Support every claim with what you see (name the game and the line) or with the counts.
  Do not invent events. Say what the side should do differently in terms a card can express:
  when to speak, how much to bid, whom to accuse or defend, what to avoid. Answer with JSON:
  diagnosis is 3 to 6 sentences; evidence is a list of short facts from the games or the counts.
diagnose_user: |-
  Side: the ${side} side.
  The champion card this side played:
  ${champion}

  What the games show:
  ${evidence}

write_system: >-
  You improve strategy cards for a Werewolf lab. ${rules} A card is advice for one role, in plain
  imperative sentences addressed to the player ("Bid 2 or 3..."). You are given the champion
  card, which is the base. Go through the base sentences one at a time. Keep each one word for
  word and in the same order, unless the diagnosis shows that sentence hurt the side or
  contradicts the findings; only those sentences may be removed or rewritten. Then add sentences
  that carry the other findings of the diagnosis. Every change must come from a finding: do not
  change anything for style, and do not rewrite the card from scratch. At least half of the base
  sentences must stay exactly as they are. Do not advise anything that contradicts the rules above
  (for example a bid to answer an accusation, which is free). The instructions are at most
  ${max_words} words in all (count them). Rules for the card: name no players, only roles and
  acts; use only what the role can know during the game (a villager cannot know who the wolves
  are; a wolf knows its partner and the wolf chat); refer to other players as "your partner",
  "they" or by role, never "he" or "she"; say how much to bid or speak; do not mention the coach,
  the games or this task. expected_moves lists 2 to 4 of the moves a player following the card
  would mostly make, from this list: ${moves}. Answer with JSON: name is a short name for the
  idea of your change, 2 or 3 lowercase words joined by underscores (such as protect_partner);
  summary is one sentence on what the card does; instructions is the full new card text;
  expected_moves is the list.
write_user: |-
  Side: the ${side} side.
  Why the champion lost:
  ${diagnosis}
  Evidence:
  ${evidence_points}

  The champion card (the base to build on):
  ${champion}
write_feedback: |-
  Your last card was rejected for these reasons. Fix them in the new card:
  ${reasons}

invalid_answer: |-
  Your last answer was not valid: ${error}. Answer again with the JSON only.

check_system: >-
  You check one strategy card for a Werewolf lab before it is played. ${rules} A card is advice
  for one role. Say it does not pass only if it relies on something that role cannot know while
  playing (who the wolves are, unless the role is a werewolf; another player's role; what the
  wolves said in private; anything about past games), asks for something the rules above do not
  allow (for example speaking out of turn or secret messages between players who are not wolves),
  or gives advice that contradicts them (for example paying tokens to answer an accusation, which
  is a free reply, or bidding more tokens than a player has).
  Do not reject a card for style, length or because you doubt it will win. Answer with JSON:
  problems lists each real violation in one short sentence. Do not list doubts or things that are
  fine. An empty list means the card passes.
check_user: |-
  The role: ${role}.
  The card:
  ${card}
