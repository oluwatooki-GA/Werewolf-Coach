# The whole app on this machine: `docker compose up --build`.
# The site is at http://localhost:3100 and the API at http://localhost:8000 (3000 is often taken).
# Change the ports with WEB_PORT and API_PORT in .env.
name: werewolf-coach

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: werewolf  # local only; the cloud database has its own
      POSTGRES_DB: werewolf
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://werewolf:werewolf@db:5432/werewolf
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3100}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data/games:/app/data/games:ro
      - ./data/coach:/app/data/coach:ro
      - ./cards:/app/cards:ro
    # load what the experiments produced (safe to repeat), then serve
    command: >
      sh -c "python -m werewolf.cli app seed && python -m werewolf.cli app serve --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000  # the site's server asks the API; the browser never does
    ports:
      - "${WEB_PORT:-3100}:3100"

volumes:
  dbdata:
